name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prototype:
    name: prototype lint / format / build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # npm 命令在 prototype/ 下执行（仓库根没有工程 package.json）
    defaults:
      run:
        working-directory: prototype
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: prototype/.nvmrc
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  backend:
    name: backend lint / tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FASTAPI_ENV: development
      PROJECT_NAME: Memo
      SECRET_KEY: ci-only-not-a-production-secret
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      # PR-7：prestart 要求管理员变量显式提供且符合 R12 密码策略。
      # 以下为 CI 一次性测试库专用占位值，非真实凭据，不得用于任何部署环境。
      FIRST_SUPERUSER: admin@example.com
      FIRST_SUPERUSER_PASSWORD: ci-only-placeholder-not-a-secret-1
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.6"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies（真锁 backend/uv.lock）
        run: uv sync --frozen
      - name: Lint
        run: uv run bash scripts/lint.sh
      - name: Migrate + initial data
        run: uv run bash scripts/prestart.sh
      - name: Tests（含迁移升降级与冒烟）
        run: uv run bash scripts/tests-start.sh "CI"

  pr-guards:
    name: PR⊆plan / R# 存在性
    # 子集检查以最近一次 accepted 的 plan 清单为基准（读基线版本，非 PR 内改后的清单）
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_REF: origin/${{ github.event.pull_request.base.ref }}
      PLAN_REF: origin/${{ github.event.pull_request.base.ref }}
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Checkout（全历史，供 merge-base 与基线 plan 读取）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: PR 变更文件 ⊆ plan 清单
        run: bash .github/scripts/check-pr-subset.sh
      - name: 测试标注的 R# 须在对应 spec 中存在
        run: bash .github/scripts/check-r-refs.sh

  frontend:
    name: frontend lint / tsc / build / gen:api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up uv（gen:api 导出 OpenAPI 需要）
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.6"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend deps（frozen，供 gen:api）
        working-directory: backend
        run: uv sync --frozen
      - name: Install frontend deps
        run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
      - name: gen:api 重跑后无 diff
        run: |
          npm run gen:api
          git diff --exit-code -- openapi.json src/lib/api/schema.d.ts

  chinese-detail:
    name: 中文 detail 扫描
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: grep 模板英文固定串
        run: bash backend/scripts/check-chinese-detail.sh

  compose-smoke:
    name: compose 冒烟（R14）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: verify-compose（AC1–AC6 + 413 + EDITH + snapshot bench）
        env:
          VERIFY_BENCH_OUT: ${{ github.workspace }}/.tmp/snapshot-bench.summary
        run: bash backend/scripts/verify-compose.sh
      - name: 写出 snapshot bench 到 Step Summary
        if: always()
        env:
          VERIFY_BENCH_OUT: ${{ github.workspace }}/.tmp/snapshot-bench.summary
        run: |
          {
            echo '## Snapshot bench（部署验证，超标不阻断）'
            echo
            if [[ -f .tmp/snapshot-bench.summary ]]; then
              echo '```'
              cat .tmp/snapshot-bench.summary
              echo '```'
            else
              echo '_未找到 .tmp/snapshot-bench.summary（verify 可能未跑到 bench 或提前失败）；见本 job 日志 `SNAPSHOT_BENCH` 行。_'
            fi
            echo
            echo '| 指标 | 上限 |'
            echo '| --- | --- |'
            echo '| 响应体大小 | ≤ 5 MB |'
            echo '| p95 延迟 | ≤ 500 ms（100 次采样） |'
          } >> "$GITHUB_STEP_SUMMARY"
