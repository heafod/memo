# Memo 前端静态服务（R14，001-plan PR-7）：
# - root /usr/share/nginx/html，try_files SPA 回退到 index.html；
# - /api 反代 backend（同源，签名会话 Cookie 无需 CORS）。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # R4b 单文件 ≤10MB；留 multipart 封装余量：10MB–11MB 之间由后端返回 413
    # 中文 detail（proxy_intercept_errors 保持默认 off，代理响应原样透传）；
    # 超过 11MB 由 nginx 直接拒绝，经下方命名 location 返回同形 JSON（R8 中文）
    client_max_body_size 11m;
    error_page 413 @request_too_large;

    location @request_too_large {
        default_type application/json;
        charset utf-8;
        charset_types application/json;
        return 413 '{"detail":"文件超过 10MB 上限"}';
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
