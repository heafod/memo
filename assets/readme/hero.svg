<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Memo — 清爽宁静、结构清晰的项目管理工作台</title>
  <desc id="heroDesc">Memo 名称、一句话价值描述，以及一枚由产品自身设计 token 绘制的三列看板标本（待办 / 进行中 / 已完成）。</desc>

  <!-- ===== 背景 ===== -->
  <rect width="1200" height="380" rx="24" fill="#FBFAF8"/>

  <!-- ===== 左列：标记 + 标题 ===== -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
    <!-- 品牌标记（同 prototype/public/favicon.svg：黑底白 M） -->
    <rect x="64" y="52" width="64" height="64" rx="14" fill="#1D1C1A"/>
    <text x="96" y="98" text-anchor="middle" font-size="38" font-weight="600" fill="#FFFFFF">M</text>

    <!-- 眉题：仓库的意图管道，即 intent/ 的产物名 -->
    <text x="148" y="89" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2.5" fill="#8C8880">INTENT &#8594; DESIGN &#8594; SPEC &#8594; PLAN &#8594; BUILD</text>

    <!-- 名称 -->
    <text x="62" y="205" font-size="92" font-weight="700" letter-spacing="-1" fill="#1D1C1A">Memo</text>

    <!-- 一句话价值 -->
    <text x="64" y="252" font-size="26" fill="#57544E">清爽宁静、结构清晰的项目管理工作台</text>
    <text x="64" y="292" font-size="26" fill="#57544E">六种项目视图，同一份数据。</text>

    <!-- 元信息 chips -->
    <g font-size="16" fill="#57544E">
      <rect x="64" y="316" width="112" height="32" rx="16" fill="#FFFFFF" stroke="#E9E7E2"/>
      <text x="120" y="337" text-anchor="middle">零依赖原型</text>
      <rect x="188" y="316" width="128" height="32" rx="16" fill="#FFFFFF" stroke="#E9E7E2"/>
      <text x="252" y="337" text-anchor="middle">32 屏设计稿</text>
      <rect x="328" y="316" width="204" height="32" rx="16" fill="#FFFFFF" stroke="#E9E7E2"/>
      <text x="430" y="337" text-anchor="middle">FastAPI + React 已定案</text>
    </g>
  </g>

  <!-- ===== 右列：看板标本（产品 token 绘制） ===== -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
    <rect x="688" y="48" width="464" height="284" rx="16" fill="#FFFFFF" stroke="#E9E7E2"/>

    <!-- 列底色 -->
    <rect x="704" y="64" width="136" height="252" rx="10" fill="#F6F5F2"/>
    <rect x="852" y="64" width="136" height="252" rx="10" fill="#F6F5F2"/>
    <rect x="1000" y="64" width="136" height="252" rx="10" fill="#F6F5F2"/>

    <!-- 列头：状态点 + 标签 -->
    <g font-size="16" font-weight="600" fill="#57544E">
      <circle cx="726" cy="86" r="4.5" fill="#7C7870"/>
      <text x="738" y="91">待办</text>
      <circle cx="874" cy="86" r="4.5" fill="#C88A14"/>
      <text x="886" y="91">进行中</text>
      <circle cx="1022" cy="86" r="4.5" fill="#2E8456"/>
      <text x="1034" y="91">已完成</text>
    </g>

    <!-- 卡片模板：title 18px，meta = 日期 mono + 头像圆点 -->
    <!-- 待办 -->
    <g>
      <rect x="712" y="104" width="120" height="64" rx="8" fill="#FFFFFF" stroke="#E9E7E2"/>
      <text x="722" y="131" font-size="18" fill="#1D1C1A">评审契约</text>
      <text x="722" y="154" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace" font-size="13" fill="#8C8880">10-14</text>
      <circle cx="806" cy="149" r="8" fill="#4B5BD6"/>

      <rect x="712" y="176" width="120" height="64" rx="8" fill="#FFFFFF" stroke="#E9E7E2"/>
      <text x="722" y="203" font-size="18" fill="#1D1C1A">修复拖拽</text>
      <text x="722" y="226" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace" font-size="13" fill="#8C8880">10-15</text>
      <circle cx="806" cy="221" r="8" fill="#C88A14"/>
    </g>

    <!-- 进行中 -->
    <g>
      <rect x="860" y="104" width="120" height="64" rx="8" fill="#FFFFFF" stroke="#E9E7E2"/>
      <text x="870" y="131" font-size="18" fill="#1D1C1A">重构设置页</text>
      <text x="870" y="154" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace" font-size="13" fill="#8C8880">10-12</text>
      <circle cx="954" cy="149" r="8" fill="#8E9AF3"/>

      <rect x="860" y="176" width="120" height="64" rx="8" fill="#FFFFFF" stroke="#E9E7E2"/>
      <text x="870" y="203" font-size="18" fill="#1D1C1A">导出设计稿</text>
      <text x="870" y="226" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace" font-size="13" fill="#8C8880">10-13</text>
      <circle cx="954" cy="221" r="8" fill="#7652C2"/>
    </g>

    <!-- 已完成 + 新任务 ghost -->
    <g>
      <rect x="1008" y="104" width="120" height="64" rx="8" fill="#FFFFFF" stroke="#E9E7E2"/>
      <text x="1018" y="131" font-size="18" fill="#1D1C1A">管道落仓</text>
      <text x="1018" y="154" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace" font-size="13" fill="#8C8880">10-11</text>
      <circle cx="1102" cy="149" r="8" fill="#2E8456"/>

      <rect x="1008" y="176" width="120" height="64" rx="8" fill="none" stroke="#DAD7D0" stroke-dasharray="4 4"/>
      <text x="1068" y="213" text-anchor="middle" font-size="18" fill="#8C8880">＋ 新任务</text>
    </g>
  </g>
</svg>
