services:

  db:
    ports:
      - "5432:5432"

  backend:
    ports:
      - "8000:8000"
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app
          ignore:
            - .venv
        - path: ./backend/pyproject.toml
          action: rebuild
        - path: ./backend/uv.lock
          action: rebuild
    environment:
      FASTAPI_ENV: "development"
